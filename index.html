<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meredith Blackmore — Under construction</title>
<meta name="robots" content="noindex">
<meta name="description" content="Meredith Blackmore — site under construction.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bone:#f3f0e9; --ink:#16130f; --ink-soft:rgba(22,19,15,.62); }
  @media (prefers-color-scheme: dark) { :root { --bone:#16130f; --ink:#f3f0e9; --ink-soft:rgba(243,240,233,.62); } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bone); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
  main { max-width: 34rem; }
  .wordmark { font-family: "Bungee Inline", "DM Sans", sans-serif; font-size: clamp(1.8rem, 6vw, 2.8rem); line-height: 1.1; margin: 0 0 2rem; }
  p { margin: 0 0 1rem; font-size: 1.05rem; line-height: 1.6; color: var(--ink-soft); }
  .tag { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; color: var(--ink); margin-bottom: 1rem; }
  a { color: var(--ink); text-underline-offset: .2em; }
</style>
</head>
<body>
<main>
  <h1 class="wordmark">Meredith Blackmore</h1>
  <p class="tag">Site under construction</p>
  <p>The website is getting a refresh and will be back soon.</p>
  <p>In the meantime, get in touch at <a href="mailto:gallerymeredith@gmail.com">gallerymeredith@gmail.com</a>.</p>
</main>
</body>
</html>
